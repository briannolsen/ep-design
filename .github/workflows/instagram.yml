name: Actualizar Instagram

on:
  schedule:
    - cron: '0 9 * * *'   # todos los días a las 06:00 de Argentina
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer perfiles y posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/fetch-instagram.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json assets/instagram
          git diff --cached --quiet || git commit -m "Actualizar datos de Instagram"
          git push
